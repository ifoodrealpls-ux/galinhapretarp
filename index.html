<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin Enterprise - GTA RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. CORE VARIABLES & DESIGN TOKENS
           ========================================================================== */
        :root {
            /* Color Palette - Dark Space Theme */
            --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0;
            --slate-300: #cbd5e1; --slate-400: #94a3b8; --slate-500: #64748b;
            --slate-600: #475569; --slate-700: #334155; --slate-800: #1e293b;
            --slate-900: #0f172a; --slate-950: #020617;
            --blue-50: #eff6ff; --blue-500: #3b82f6; --blue-600: #2563eb; --blue-700: #1d4ed8;
            --emerald-500: #10b981; --emerald-600: #059669;
            --red-500: #ef4444; --red-600: #dc2626;
            --amber-500: #f59e0b; --amber-600: #d97706;
            --purple-500: #8b5cf6; --cyan-500: #06b6d4;
            /* Semantic Backgrounds */
            --bg-base: #05080f;
            --bg-surface: #0a0f1c;
            --bg-surface-raised: #111827;
            --bg-radial: radial-gradient(circle at 50% -20%, #172442 0%, #05080f 80%);
            --terminal-bg: #02040a;
            /* Glassmorphism */
            --glass-bg: rgba(10, 15, 28, 0.6);
            --glass-border: rgba(255, 255, 255, 0.04);
            --glass-border-light: rgba(255, 255, 255, 0.08);
            /* Text */
            --text-primary: var(--slate-50);
            --text-secondary: var(--slate-400);
            --text-muted: var(--slate-500);
            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.5), 0 2px 4px -2px rgb(0 0 0 / 0.5);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.6), 0 4px 6px -4px rgb(0 0 0 / 0.6);
            --shadow-glow-blue: 0 0 20px rgba(59, 130, 246, 0.2);
            --shadow-glow-red: 0 0 20px rgba(239, 68, 68, 0.2);
            /* Dimensions */
            --sidebar-width: 280px;
            --header-height: 72px;
            --radius-sm: 6px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px; --radius-pill: 9999px;
            --transition-fast: 0.15s ease; --transition-normal: 0.3s ease; --transition-slow: 0.5s ease;
        }

        /* ==========================================================================
           2. GLOBAL RESET & UTILITIES
           ========================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg-base); background-image: var(--bg-radial);
            color: var(--text-primary); min-height: 100vh; overflow: hidden; font-size: 15px;
            -webkit-font-smoothing: antialiased; display: flex;
        }
        button, input { font-family: inherit; outline: none; border: none; background: none; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        /* Typography */
        h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.02em; color: var(--text-primary); }
        .text-mono { font-family: 'JetBrains Mono', monospace; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--slate-700); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--slate-600); }

        /* ==========================================================================
           3. UI COMPONENTS (BUTTONS, INPUTS, CARDS, TERMINAL)
           ========================================================================== */
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);
        }
        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 24px; border-radius: var(--radius-pill); font-weight: 500; font-size: 0.95rem;
            cursor: pointer; transition: var(--transition-fast); position: relative; overflow: hidden;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background: var(--blue-600); color: white; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3); }
        .btn-primary:hover:not(:disabled) { background: var(--blue-500); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--red-500); border: 1px solid rgba(239, 68, 68, 0.2); }
        .btn-danger:hover:not(:disabled) { background: var(--red-500); color: white; }
        .btn-outline { border: 1px solid var(--glass-border-light); color: var(--text-secondary); }
        .btn-outline:hover:not(:disabled) { background: rgba(255,255,255,0.05); color: var(--text-primary); }
        .btn-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: var(--transition-fast); }
        .btn-icon:hover { background: rgba(255,255,255,0.1); }
        /* Inputs */
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; margin-left: 12px; }
        .input-group { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 16px; width: 20px; height: 20px; stroke: var(--text-muted); pointer-events: none; transition: var(--transition-fast); }
        .form-control {
            width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border);
            border-radius: var(--radius-pill); padding: 14px 16px 14px 48px; color: var(--text-primary);
            font-size: 0.95rem; transition: var(--transition-fast);
        }
        .form-control:focus { border-color: var(--blue-500); background: rgba(0, 0, 0, 0.4); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        .form-control:focus + .input-icon { stroke: var(--blue-500); }
        /* Badges */
        .badge { padding: 4px 10px; border-radius: var(--radius-pill); font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .badge-success { background: rgba(16, 185, 129, 0.1); color: var(--emerald-500); border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-danger { background: rgba(239, 68, 68, 0.1); color: var(--red-500); border: 1px solid rgba(239, 68, 68, 0.2); }
        .badge-warning { background: rgba(245, 158, 11, 0.1); color: var(--amber-500); border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge-cyan { background: rgba(6, 182, 212, 0.1); color: var(--cyan-500); border: 1px solid rgba(6, 182, 212, 0.2); }
        /* Terminal Component */
        .terminal-window {
            background: var(--terminal-bg); border: 1px solid var(--slate-800); border-radius: var(--radius-lg);
            overflow: hidden; display: flex; flex-direction: column; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .terminal-header {
            background: var(--slate-900); padding: 8px 16px; display: flex; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--slate-800); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--slate-400);
        }
        .terminal-dots { display: flex; gap: 6px; }
        .terminal-dots span { width: 10px; height: 10px; border-radius: 50%; }
        .terminal-dots .red { background: #ef4444; }
        .terminal-dots .amber { background: #f59e0b; }
        .terminal-dots .green { background: #10b981; }
        .terminal-body {
            padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--slate-300);
            height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
        }
        .terminal-line { display: flex; gap: 8px; word-break: break-all; }
        .terminal-line .time { color: var(--slate-500); }
        .terminal-line .prompt { color: var(--emerald-500); font-weight: bold; }
        .terminal-line .error { color: var(--red-500); }
        .terminal-line .info { color: var(--cyan-500); }
        .terminal-line .warn { color: var(--amber-500); }
        .terminal-input-wrapper { display: flex; align-items: center; padding: 12px 16px; background: rgba(255,255,255,0.02); border-top: 1px solid var(--slate-800); font-family: 'JetBrains Mono', monospace; }
        .terminal-input-wrapper span { color: var(--emerald-500); font-weight: bold; margin-right: 8px; }
        .terminal-input-wrapper input {
            flex: 1; background: transparent; border: none; color: var(--slate-50); font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem; outline: none; caret-color: var(--emerald-500);
        }
        .terminal-input-wrapper input::placeholder { color: var(--slate-600); }
        /* Loading Spinner */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        .btn.loading .spinner { display: block; }
        .btn.loading .btn-text { display: none; }

        /* ==========================================================================
           4. LAYOUT & SCREENS
           ========================================================================== */
        .screen { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; opacity: 0; transition: opacity var(--transition-normal); }
        .screen.active { display: flex; opacity: 1; z-index: 10; }
        /* Screen: Firewall / Blocked */
        #screen-firewall { align-items: center; justify-content: center; flex-direction: column; background: var(--bg-base); }
        .firewall-card { max-width: 480px; width: 90%; padding: 48px 40px; text-align: center; position: relative; overflow: hidden; }
        .shield-icon {
            width: 80px; height: 80px; margin: 0 auto 32px; border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);
            box-shadow: var(--shadow-glow-red);
        }
        .shield-icon svg { width: 40px; height: 40px; stroke: var(--red-500); }
        .ip-box {
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: var(--radius-md);
            padding: 16px; margin: 32px 0; display: flex; align-items: center; justify-content: space-between;
        }
        .ip-box .ip-address { font-family: 'JetBrains Mono'; font-size: 1.2rem; font-weight: 700; color: var(--amber-500); }
        /* Screen: Login */
        #screen-login { align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 420px; padding: 48px; position: relative; }
        .login-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--blue-500), transparent); }
        .login-header { text-align: center; margin-bottom: 40px; }
        .login-logo { width: 56px; height: 56px; margin: 0 auto 16px; background: rgba(37, 99, 235, 0.1); border-radius: 16px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(37, 99, 235, 0.2); }
        .login-logo svg { width: 28px; height: 28px; stroke: var(--blue-500); }
        .role-selector { display: flex; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: var(--radius-pill); padding: 4px; margin-bottom: 32px; position: relative; }
        .role-btn { flex: 1; padding: 10px; font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); z-index: 2; border-radius: var(--radius-pill); transition: var(--transition-normal); }
        .role-btn.active { color: white; }
        .role-indicator { position: absolute; top: 4px; left: 4px; bottom: 4px; width: calc(50% - 4px); background: var(--blue-600); border-radius: var(--radius-pill); transition: transform var(--transition-normal); z-index: 1; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4); }
        .role-selector[data-role="admin"] .role-indicator { transform: translateX(100%); }

        #screen-dashboard { flex-direction: row; }
        /* Sidebar */
